<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/rotas.js?v=3"></script>
  <script src="js/estrutura.js"></script>
  <script>document.write(`<title>${TITULO_SITE}Home</title>`);</script>
</head>
<body>

<div id="app">
  <app-header></app-header>
  <main>
    <div>    
      <div v-if="carregando">Carregando...</div>
      <div v-else>
        {{ dados ? dados.mensagem : '' }}
      </div>
    </div> 
  </main>
  <app-footer></app-footer> 

  <!-- Componente Modal para Erros -->
  <app-modal :visivel="modalErroVisivel" :mensagem="mensagemErro" @fechar="modalErroVisivel = false"></app-modal>
</div>

<script>
  const { createApp } = Vue;

  const app = createApp({
    data() {
      return {
        dados: null,
        carregando: false,
        modalErroVisivel: false,
        mensagemErro: ''
      };
    }, 
    methods: {
      async buscarDados() {
        this.carregando = true;
        try {
          this.dados = await Utils.apiFetch(Rotas.home.get());
          console.log(this.dados);
        } catch (error) {
          console.error("Erro ao buscar home:", error);
          this.mensagemErro = "Não foi possível conectar ao servidor.";
          this.modalErroVisivel = true;
        } finally {
          this.carregando = false;
        }
      }
    },
    mounted() {
      this.buscarDados();
    }
  });

  app.component('app-header', AppHeader);
  app.component('app-footer', AppFooter);
  app.component('app-modal', AppModal);
  app.mount('#app');
</script>
</body>
</html>
