<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/config.js"></script>
  <script src="js/rotas.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/estrutura.js"></script>
  <script>document.write(`<title>${TITULO_SITE}Home</title>`);</script>
</head>
<body>

<div id="app">
  <app-header></app-header>
  
  <main style="padding: 20px;">
    <div>   
      <h2>Home (Sem Parâmetro)</h2> 
      <button @click="buscarDados">
        {{ dados ? 'Recarregar dados' : 'Buscar dados do backend' }}
      </button>
      <div v-if="dados && dados.mensagem">
          <h3>{{ dados.mensagem }}</h3>
      </div>

      <hr style="margin: 20px 0;">

      <h2>Home (Com Parâmetro)</h2>
      <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
        <input type="number" v-model.number="valorParametro" placeholder="Digite um número">
        <button @click="buscarDadosComParametro">
          Buscar com parâmetro
        </button>
      </div>
      <div v-if="dadosParam && dadosParam.mensagem">
          <h3>{{ dadosParam.mensagem }}</h3>
      </div>
    </div>
    
    <br>
    <a href="https://localhost:7219/api/home" target="_blank">teste endpoint sem parâmetro</a>
  </main>

  <app-footer></app-footer> 

  <!-- Componente da Modal global controlada pelo Utils -->
  <app-modal 
    :visivel="Utils.modalState.visivel" 
    :mensagem="Utils.modalState.mensagem" 
    @fechar="Utils.fecharModal()">
  </app-modal>
</div>

<script>
  const { createApp } = Vue;

  const app = createApp({
    data() {
      return {
        dados: null,
        dadosParam: null,
        valorParametro: 10,
        carregando: false,
        Utils: Utils // Disponibiliza o objeto Utils dentro do template do Vue
      };
    }, 
    methods: {
      async buscarDados() {
        this.carregando = true;
        try {
          this.dados = await Utils.apiFetch(Rotas.home());
          console.log(this.dados);
        } catch (erro) {
          console.error(erro);
        } finally {
          this.carregando = false;
        }
      },

      async buscarDadosComParametro() {
        this.carregando = true;
        try {
          const rota = Rotas.homeComParametro(this.valorParametro);
          this.dadosParam = await Utils.apiFetch(rota);
          console.log(this.dadosParam);
        } catch (erro) {
          console.error(erro);
        } finally {
          this.carregando = false;
        }
      }
    }
  });

  // Registra os componentes globais
  app.component('app-header', AppHeader);
  app.component('app-footer', AppFooter);
  app.component('app-modal', AppModal);
  
  app.mount('#app');
</script>
</body>
</html>
