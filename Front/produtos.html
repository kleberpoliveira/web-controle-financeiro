<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"> 
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/estrutura.js"></script>
  <script>document.write(`<title>${TITULO_SITE}Produtos</title>`);</script>  
</head>
<body>

<div id="app">
 
  <!-- HEADER -->
	<app-header></app-header>

  <!-- CONTEÚDO -->
  <main>
  
    <div>

      <!-- LISTBOX (SOMENTE ELE MUDOU) -->
      <label>Empresa</label><br>
      <select v-model="empresaSelecionada" class="select">
        <option value="">-- selecione --</option>
        <option v-for="l in lojas" :value="l.id_Loja">
          {{ l.id_Loja }} - {{ l.nome_Fantasia }} 
        </option>
      </select>

      <br><br>

      <!-- BOTÃO ORIGINAL (INALTERADO) -->
      <button @click="buscarDados">
        {{ dados ? 'Recarregar dados' : 'Buscar dados do backend' }}
      </button>

      <div v-if="dados && dados.length">
        <table>
          <thead>
            <tr> 
              <th>Id Produto</th>
              <th>Cód. Barras</th>
              <th>Descrição</th>
              <th>Id Loja</th>
              <th>Razão Social</th>
              <th>Nome Fantasia</th> 
            </tr>
          </thead>

          <tbody>
            <tr v-for="p in dados" :key="p.id_Produto_Loja"> 
              <td>{{ p.id_Produto_Loja }}</td>
              <td>{{ p.cod_Barras }}</td>
              <td>{{ p.descricao }}</td>
              <td>{{ p.id_Loja }}</td>
              <td>{{ p.razao_Social }}</td>
              <td>{{ p.nome_Fantasia }}</td> 
            </tr>
          </tbody>
        </table>
      </div>

    </div>
    
  </main>

  <!-- FOOTER -->
  <app-footer></app-footer> 

</div>

<script>
const { createApp } = Vue;

const app = createApp({
  data() {
    return {
      dados: null,
      lojas: [],
      empresaSelecionada: ""
    };
  },
  mounted() {
     fetch(`${API_URL}/loja`)
      .then(r => r.json())
      .then(d => this.lojas = d);
  },
  methods: {
	async buscarDados() {
	  this.carregando = true;
	  
	  let endpoint = '/produto/ListaProdutos';
	  if (this.empresaSelecionada) {
		endpoint += "?empresaId=" + this.empresaSelecionada;
	  }

	  try {
		this.dados = await Utils.apiFetch(endpoint);
	  } finally {
		this.carregando = false;
	  }
	}
  }
});
app.component('app-header', AppHeader);
app.component('app-footer', AppFooter);
app.mount('#app');
</script>

</body>
</html>
